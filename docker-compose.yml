services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: saber_postgres
    restart: always
    environment:
      POSTGRES_USER: saber_admin
      POSTGRES_PASSWORD: saber_secret_password
      POSTGRES_DB: saber_db
    ports:
      - "5432:5432"
    volumes:
      - saber_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  redis:
    image: redis:7-alpine
    container_name: saber_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: saber_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://saber_admin:saber_secret_password@postgres:5432/saber_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saber_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  saber_pgdata: